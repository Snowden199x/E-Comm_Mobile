name: vendo_rider
description: "Vendo Rider app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.1
  flutter_svg: ^2.0.10+1
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  http: ^1.6.0
  flutter_secure_storage: ^10.3.4
  google_sign_in: ^7.2.0
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/vendo_app_logo.png"
  min_sdk_android: 21

  # fonts:
  #   - family: YourFont
  #     fonts:
